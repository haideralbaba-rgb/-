<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <pattern id="keffiyeh" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#1f5c44"/>
      <rect width="14" height="3" fill="#f4ecd8"/>
      <rect width="3" height="14" fill="#f4ecd8"/>
    </pattern>
    <clipPath id="headClip">
      <path d="M100 34c-24 0-38 16-41 34-2 12-1 20 2 28-5 4-8 11-8 19 0 10 6 18 6 28 0 20 17 40 41 40s41-20 41-40c0-10 6-18 6-28 0-8-3-15-8-19 3-8 4-16 2-28-3-18-17-34-41-34z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <circle cx="100" cy="100" r="100" fill="#e2792f"/>

  <!-- face base (cream) -->
  <path d="M100 34c-24 0-38 16-41 34-2 12-1 20 2 28-5 4-8 11-8 19 0 10 6 18 6 28 0 20 17 40 41 40s41-20 41-40c0-10 6-18 6-28 0-8-3-15-8-19 3-8 4-16 2-28-3-18-17-34-41-34z" fill="#f4ecd8"/>

  <!-- keffiyeh headwrap covering the top half -->
  <path d="M100 30c-27 0-44 18-47 38-1.5 10-1 18 1 25 3 6 9 9 15 6 4-2 6-6 6-11-1-8 1-15 6-19 4 12 3 25-1 34 5 3 12 4 20 4s15-1 20-4c-4-9-5-22-1-34 5 4 7 11 6 19 0 5 2 9 6 11 6 3 12 0 15-6 2-7 2.5-15 1-25-3-20-20-38-47-38z" fill="url(#keffiyeh)" clip-path="url(#headClip)"/>

  <!-- keffiyeh front flap details -->
  <path d="M100 30c-10 0-18 4-24 10 6 14 16 22 24 22s18-8 24-22c-6-6-14-10-24-10z" fill="url(#keffiyeh)" clip-path="url(#headClip)"/>

  <!-- headband -->
  <rect x="55" y="60" width="90" height="8" fill="#1f5c44" clip-path="url(#headClip)"/>

  <!-- ears -->
  <ellipse cx="58" cy="102" rx="7" ry="10" fill="#f4ecd8"/>
  <ellipse cx="142" cy="102" rx="7" ry="10" fill="#f4ecd8"/>

  <!-- eyebrows -->
  <path d="M78 92c5-4 12-4 17-1" stroke="#1f5c44" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M105 91c5-3 12-3 17 1" stroke="#1f5c44" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="86" cy="101" rx="5" ry="6" fill="#1f5c44"/>
  <ellipse cx="114" cy="101" rx="5" ry="6" fill="#1f5c44"/>
  <circle cx="87.5" cy="99.5" r="1.4" fill="#f4ecd8"/>
  <circle cx="115.5" cy="99.5" r="1.4" fill="#f4ecd8"/>

  <!-- nose -->
  <path d="M99 98c-1 8-4 14-7 18 3 3 8 4 12 1" stroke="#1f5c44" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- mustache -->
  <path d="M78 122c8 6 16 8 22 8s14-2 22-8c-4 8-13 13-22 13s-18-5-22-13z" fill="#1f5c44"/>

  <!-- smiling mouth -->
  <path d="M88 132c6 6 18 6 24 0" stroke="#f4ecd8" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- beard -->
  <path d="M62 118c-2 14 2 28 12 38 8 8 17 12 26 12s18-4 26-12c10-10 14-24 12-38-4 10-10 16-16 16-2 6-6 10-11 12 1-5 0-9-2-12-3 6-9 10-9 10s-6-4-9-10c-2 3-3 7-2 12-5-2-9-6-11-12-6 0-12-6-16-16z" fill="#1f5c44"/>

</svg>
